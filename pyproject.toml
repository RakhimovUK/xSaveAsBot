[project]
name = "xsaveasbot"
version = "0.1.0"
description = "xSaveAsBot: Telegram media saver bot with zero-egress delivery"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "telethon==1.45.0",
    "arq==0.28.0",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic-settings==2.16.2",
    "fluent.runtime==0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "aiosqlite==0.22.1",
    "fakeredis==2.40.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["locales/*/*.ftl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# RUF012: arq WorkerSettings use plain class attributes
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
